<#define __DATAPATH__="{#LAM.DATA#}" />
#define# __MENU__ <#include file="__DATAPATH__/menu.json" /> #end#

<#Block:begin id="menu">
<div>
    <div class="sectionBox sectionTitle-A2"><h2>{{ title }} <a style="color: #fff;float: right;font-size: 10px;font-weight: normal;" href="index.html?r=site/logout">退出登录</a></h2></div>
    
    <el-container class="">
        <el-aside width="200px" style="background-color: rgb(238, 241, 246)">
          <el-menu :unique-opened="true" :default-openeds="defaultOpeneds" :default-active="defaultActive" active-text-color="#ffd04b" background-color="rgb(238, 241, 246)" class="el-menu-vertical-demo" @select="handleSelect">
            <el-submenu v-for="(v1, i) in menus" :key="i" :index="v1.index">
              <template slot="title"><i class="el-icon-message"></i>{{ v1.title }}</template>
              <el-menu-item-group v-if="v1.ul">
                <el-menu-item v-for="(v2, j) in v1.ul" :key="j" :index="v2.index">
                  <router-link @click.native="click" :to="v2.href">{{ v2.title }}</router-link>
                </el-menu-item>
              </el-menu-item-group>
            </el-submenu>
          </el-menu>
        </el-aside>
    </el-container>

</div>
<#Block:end>


<script type="text/javascript">
    //menu
    LAM.run(function() {
        'use strict';
        var System = this;

        var MenuComponent = {
          name: "MenuComponent",
          props: {
            "title": String
          },
          created() {
            this.setActiveByRoute();

          },
          data: function () {
            return {
              menus: __MENU__,
              defaultOpeneds: [],
              defaultActive: "",
              isCollapse: true
            }
          },
          methods: {
            click()  {
              this.$emit('drawer');
            },
            handleSelect(index) {
              this.defaultActive = index;
            },
            setActiveByRoute() {
              // 获取当前路由的 path
              var currentPath = '';
              if (this.$route && this.$route.path) {
                currentPath = this.$route.path;
              }
              if (!currentPath) {
                // 降级：尝试用 ?r= 参数匹配
                var urlParam = System.get("r");
                if (urlParam) {
                  currentPath = '/' + urlParam;
                }
              }
              if (!currentPath) return;

              for (var i = 0; i < this.menus.length; i++) {
                var group = this.menus[i];
                var items = group.ul;
                if (items && items.length > 0) {
                  for (var j = 0; j < items.length; j++) {
                    if (items[j].href === currentPath) {
                      this.defaultActive = items[j].index;
                      // 同时展开对应父级菜单
                      if (this.defaultOpeneds.indexOf(group.index) === -1) {
                        this.defaultOpeneds.push(group.index);
                      }
                      return;
                    }
                  }
                }
              }
            }
          },
          template: `<#=block id="menu" />`
        };

        System.export('MenuComponent', MenuComponent);

    });
</script>

<style type="text/css">
  .el-menu-item a { display: block;}

  /* 菜单项选中状态 - 底色+文字变色 */
  .el-menu-item.is-active {
    background-color: #6d1667 !important;
  }
  .el-menu-item.is-active a {
    color: #ffd04b !important;
  }

  /* 悬停效果 */
  .el-menu-item:hover {
    background-color: #e8e0f0 !important;
  }
  .el-menu-item.is-active:hover {
    background-color: #7d1e77 !important;
  }
</style>
