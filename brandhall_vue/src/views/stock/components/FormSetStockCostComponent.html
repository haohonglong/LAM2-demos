<#define __PACKAGE__="stock.components" />
<#define __ID__="__PACKAGE__.FormSetStockCostComponent" />
<#define __COMPONENTS__="{#LAM.COMPONENTS#}" />
<#define __VIEWS__="{#LAM.VIEWS#}" />
<#define ~/="__VIEWS__/stock/" />

<#Block:begin id="__ID__">
<div v-loading="loading">
    <el-dialog 
        :title="title"
        :visible.sync="dialogVisible"
        :close-on-click-modal="false"
        :lock-scroll="false"
        width="95%"
        top="5vh"
        class="mobile-form-dialog"
        custom-class="mobile-dialog">
        <div class="dialog-content">
            <el-form :model="form" label-width="100px" class="mobile-form">
                <div class="form-section">
                    <div class="section-title">股票成本</div>
                    <el-row :gutter="10">
                        <el-col :xs="24" :sm="12">
                            <el-form-item label="股票成本:">
                                <el-input v-model="form.cost" size="medium" placeholder="请输入股票成本"></el-input>
                                
                            </el-form-item>
                        </el-col>
                    </el-row>
                </div>
            </el-form>
        </div>
        <div slot="footer" class="dialog-footer mobile-footer">
            <el-button type="primary" @click="submit()" class="submit-btn" :loading="loading">修改</el-button>
            <el-button @click="dialogVisible = false" class="cancel-btn">取消</el-button>
        </div>
    </el-dialog>

    
</div>


<#Block:end>

<script type="text/javascript">
    LAM.run(function(){
        'use strict';
        var System = this;
        const Api = System.require("Api");
        var FormComponent = {
          name: "FormSetStockCostComponent",
          props: {
            'title': {
                type: [String],
                default: ""
            }
          },
          components: { },
          data() {
            return {
                'loading': false,
                'form':{
                    'simulation_id': null,
                    'cost': 0
                },
                'formError':{
                    'cost': ""
                },
                // 服务器返回的错误信息
                'serverErrors': {
                    'cost': ""
                },
                'dialogVisible': false
            }
          },
          methods: {
            empty(str){
                return System.empty(str)

            },
            ok() {
                this.loading = false;
                this.dialogVisible = false;
                this.init();
                
                
            },
            init() {
                this.form.cost = "";
                
            },
            setForm(simulation_id, cost) {
                this.form.simulation_id = simulation_id;
                this.form.cost = cost;
            },
            submit() {
                const simulation_id = this.form.simulation_id;
                const cost = this.form.cost;
                

                this.loading = true;
                Api.stockSimulation.setCost({
                    simulation_id,
                    cost
                }, D => {
                    if(D.status){
                        this.$message({
                            type: 'success',
                            message: D.message
                        });
                        this.ok();
                        // this.$emit('feach-by-stockid', stock_id);
                        this.$emit('get-list-stock');

                    }
                    this.loading = false;

                });
            }
          },
          watch: {
            dialogVisible(newVal) {
                
                if (newVal) {
                    // 对话框显示时，确保内容正确显示
                    this.$nextTick(() => {
                        // 处理移动端显示问题
                    });
                }
            }
          },
          template: `<#=block id="__ID__" />`
        };

        System.export('__ID__', FormComponent);
    });
</script>
